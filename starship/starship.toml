# Prompt Starship — perfil completo (GUI: kitty/Alacritty, Nerd Font disponível)
# Estilo Powerline (segmentos com fundo sólido conectados por setas ),
# adaptado do preset oficial "Catppuccin Powerline" (starship.rs/presets).
# Substitui o antigo zsh/shared/p10k.zsh.
#
# Paleta: Catppuccin Macchiato. O [os] (ícone da distro — Gentoo aqui,
# Arch na outra máquina) sai em mauve, o accent que você escolheu pra
# diferenciar essa máquina; o resto segue o fluxo de cor do preset original.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](mauve)\
$os\
[](bg:pink fg:mauve)\
$directory\
[](bg:peach fg:pink)\
$git_branch\
$git_status\
[](fg:peach bg:green)\
$nodejs\
$python\
$golang\
$rust\
$lua\
$perl\
[](fg:green bg:lavender)\
$cmd_duration\
[ ](fg:lavender)\
$line_break\
$character"""

palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[os]
disabled = false
style = "bg:mauve fg:crust"

[os.symbols]
Gentoo = "󰣨"
Arch = "󰣇"
Manjaro = ""
Linux = "󰌽"

[directory]
style = "bg:pink fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bg:peach"
format = '[[ $symbol $branch ](fg:crust bg:peach)]($style)'

[git_status]
style = "bg:peach"
format = '[[($all_status$ahead_behind )](fg:crust bg:peach)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[lua]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[perl]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[cmd_duration]
min_time = 2000
show_milliseconds = true
format = "[  $duration ](fg:crust bg:lavender)"
disabled = false

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold mauve)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_one_symbol = '[❮](bold lavender)'
vimcmd_replace_symbol = '[❮](bold lavender)'
vimcmd_visual_symbol = '[❮](bold yellow)'
