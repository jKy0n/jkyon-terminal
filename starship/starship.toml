# Prompt Starship — perfil completo (GUI: kitty/Alacritty, Nerd Font disponível)
# Substitui o antigo zsh/shared/p10k.zsh. Propositalmente enxuto: o motivo da
# troca foi justamente cansar da quantidade de segmentos configuráveis do p10k.
#
# Paleta: Catppuccin Macchiato, accent Mauve — mesmo esquema já aplicado em
# KDE, GTK, Papirus e kitty (ver docs/theme.md ou histórico de commits).

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$lua\
$perl\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[directory]
style = "bg:mauve fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bg:surface0 fg:mauve"
format = "[[ $symbol$branch ]($style)]"
symbol = " "

[git_status]
style = "bg:surface0 fg:peach"
format = "[[($all_status$ahead_behind) ]($style)]"

[nodejs]
style = "fg:green"
format = "[[ $symbol($version) ](fg:green)]"
symbol = " "

[python]
style = "fg:yellow"
format = "[[ $symbol($version) ](fg:yellow)]"
symbol = " "

[golang]
style = "fg:sapphire"
format = "[[ $symbol($version) ](fg:sapphire)]"
symbol = " "

[rust]
style = "fg:peach"
format = "[[ $symbol($version) ](fg:peach)]"
symbol = " "

[lua]
style = "fg:blue"
format = "[[ $symbol($version) ](fg:blue)]"
symbol = " "

[perl]
style = "fg:blue"
format = "[[ $symbol($version) ](fg:blue)]"
symbol = " "

[cmd_duration]
style = "fg:overlay1"
format = "[[ took $duration ](fg:overlay1)]"
min_time = 2000

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
