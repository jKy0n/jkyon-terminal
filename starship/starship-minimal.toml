# Prompt Starship — perfil mínimo (console físico do kernel / TTY headless)
# Usado via $STARSHIP_CONFIG em zsh/minimal.zsh. Equivalente ao antigo
# POWERLEVEL9K_MODE='ascii': o console só tem a fonte bitmap (Terminus),
# sem os glyphs Unicode extras de Nerd Font — aqui os símbolos são só ASCII.

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[directory]
style = "bg:blue fg:crust"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true

[git_branch]
style = "bg:green fg:crust"
format = "[ $symbol$branch ]($style)"
symbol = ""

[git_status]
style = "bg:green fg:crust"
format = "[($all_status$ahead_behind )]($style)"

[cmd_duration]
style = "fg:crust bg:yellow"
format = "[ took $duration ](fg:overlay1)"
min_time = 2000

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"
