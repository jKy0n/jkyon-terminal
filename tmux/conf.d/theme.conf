# ~/.config/tmux/conf.d/theme.conf

# # Configuracoes de tema
# # Configure the Catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_window_number_position "right"
set -ogq @catppuccin_window_flags "text"

# # Load Catppuccin
set -g @catppuccin_status_right_separator_inverse "yes"
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# # Make the status line pretty and add some modules
set -g status on
set -g status-right-length 150
set -g status-left-length 100

# # Remove window names from status line
set -g window-status-format ""
set -g window-status-current-format ""

# # Configure status modules
# Texto da sessao: fg=thm_fg (uniforme com os outros textos), nao mais
# session_color (evita acoplar cor do texto com cor do icone/separador).
# Icone da sessao: espaco dos dois lados, igual aos outros modulos.
set -g status-left "#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}] #{E:@catppuccin_session_text} #[fg=#{E:@catppuccin_session_color},bg=#{E:@thm_surface_0}]#{@catppuccin_status_middle_separator}#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_session_color}] #{E:@catppuccin_session_icon} #[fg=#{E:@catppuccin_session_color},bg=#{E:@thm_surface_0}]#[fg=#{E:@thm_fg},bg=@thm_red]#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}]#{E:@catppuccin_application_text} #[fg=#{E:@catppuccin_application_color},bg=#{E:@thm_surface_0}]#{@catppuccin_status_middle_separator}#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_application_color}] #{E:@catppuccin_application_icon} #[fg=#{E:@catppuccin_application_color},bg=default] #[fg=#{E:@thm_fg},bg=default]"

# Customize user and directory text
set -g @catppuccin_user_text " #{user} "

set -g status-right "#[fg=#{E:@catppuccin_user_color},bg=default]#[fg=default,bg=default]#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_user_color}] #{E:@catppuccin_user_icon} #[fg=#{E:@catppuccin_user_color},bg=#{E:@thm_surface_0}]#{@catppuccin_status_middle_separator}#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}]#{E:@catppuccin_user_text}#[fg=#{E:@catppuccin_host_color},bg=default]#[fg=default,bg=#{E:@thm_surface_0}]#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_host_color}] #{E:@catppuccin_host_icon} #[fg=#{E:@catppuccin_host_color},bg=#{E:@thm_surface_0}]#{@catppuccin_status_middle_separator}#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}]#{E:@catppuccin_host_text} #[fg=#{E:@catppuccin_host_color},bg=default]"
# Timer de comando em execucao - CENTRALIZADO via status-format[0] customizado.
set -g status-format[0] "#[align=left]#{E:status-left}#[align=centre]#(f=/tmp/tmux-cmd-timer-#{pane_id}; if [ -f \"\$f\" ]; then s=$(( $(date +%%s) - $(cat \"\$f\") )); printf '#[fg=#{E:@thm_yellow},bg=default]#[fg=#{E:@thm_crust},bg=#{E:@thm_yellow}] 󰥔  #[fg=#{E:@thm_yellow},bg=#{E:@thm_surface_0}]#{@catppuccin_status_middle_separator}#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}] %%02d:%%02d:%%02d #[fg=#{E:@thm_surface_0},bg=default]#[fg=default,bg=default]' $((s/3600)) $((s%%3600/60)) $((s%%60)); fi)#[align=right]#{E:status-right}"
