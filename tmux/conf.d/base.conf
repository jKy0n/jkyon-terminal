# ---------- [ Configurações Essenciais ] ----------
#set -g default-terminal "xterm-256color"       # Mais compatível que tmux-256color
#set -as terminal-overrides ',xterm-256color:RGB,:xterm-256color:delete=\E[3~'
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',tmux-256color:Tc'

# status-interval baixo (default do tmux é 15s) — necessário pro timer de
# comando em execução (theme.conf) parecer "ao vivo". Trade-off: todo #()
# no status-right/left roda com essa frequência, não só o timer.
set -g status-interval 1

# ---------- [ Controle do Mouse ] ----------
set -g mouse on
set -g default-command 'zsh'

# ---------- [ Compatibilidade com alacritty + zsh ] ----------
set -g xterm-keys on
set -s extended-keys on

# ---------- [ clipboard options ] ----------
set -g allow-passthrough on
set -g set-clipboard on

# ---------- [ GPG_TTY / pinentry ] ----------
# gpg-agent lembra o tty da última chamada; ao trocar de pane/attach num
# pane diferente, pinentry-curses tenta desenhar no tty errado e falha
# silenciosamente ("A locale function failed") ou borra o pane. Avisamos
# o agente direto via UPDATESTARTUPTTY (sem depender do zsh reexportar
# GPG_TTY) toda vez que o foco muda ou um client anexa.
set -g focus-events on
set-hook -g pane-focus-in 'run-shell "GPG_TTY=#{pane_tty} gpg-connect-agent UPDATESTARTUPTTY /bye >/dev/null 2>&1"'
set-hook -g client-attached 'run-shell "GPG_TTY=#{pane_tty} gpg-connect-agent UPDATESTARTUPTTY /bye >/dev/null 2>&1"'
