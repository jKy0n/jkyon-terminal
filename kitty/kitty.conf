#
#        Title:      kitty.conf
#        Brief:      Configuração do terminal Kitty — usado onde precisa de imagem (spotify_player etc.)
#        Path:       /home/jkyon/.config/kitty/kitty.conf
#        Author:     John Kennedy a.k.a. jKyon
#        Notes:      Tema vive em theme.conf, separado (mesmo padrão do tmux/Alacritty:
#                    tema é a única coisa trocada como bloco inteiro, sem tocar comportamento).
#

# ---------- [ Shell ] ----------
shell /bin/zsh -l

# TERM: NÃO sobrescrever (ao contrário do Alacritty).
# Deixa o default xterm-kitty — dá acesso à terminfo estendida do Kitty
# (cursor styles, truecolor nativo). Dentro do tmux isso não importa,
# porque default-terminal já força xterm-256color pra todo processo filho.

# ---------- [ Unicode ] ----------
include symbols.conf

# ---------- [ Fonte ] ----------
font_family      MesloLGS Nerd Font
font_size        9.0
# confirme o nome exato via `fc-list | grep -i meslo` antes do primeiro load —
# Kitty é estrito com o nome da família, diferente do Alacritty.

# ---------- [ Janela ] ----------
background_opacity      0.8
hide_window_decorations yes
window_padding_width    1 0
placement_strategy      center

# ---------- [ Cursor ] ----------
cursor_shape           beam
cursor_blink_interval  0.5

# ---------- [ Mouse ] ----------
mouse_hide_wait          -1
wheel_scroll_multiplier  3.0

# ---------- [ Scrollback ] ----------
scrollback_lines  10000

# ---------- [ URLs ] ----------
open_url_with     firefox

# ---------- [ Tema ] ----------
include catppuccin-macchiato-mauve.conf


allow_remote_control yes

map shift+enter send_text all \x1b\r
